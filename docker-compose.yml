services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  infinity:
    image: michaelf34/infinity:latest-cpu
    container_name: infinity
    ports:
      - "7997:7997"
    volumes:
      - ./model_cache:/app/.cache
    command: >
      v2
      --model-id BAAI/bge-m3
      --engine optimum
      --model-id BAAI/bge-reranker-v2-m3
      --engine torch
      --port 7997
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7997/health"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 600s
    # Dense + sparse embeddings and reranking on one port:
    # curl -s http://localhost:7997/embeddings \
    #   -X POST -H "Content-Type: application/json" \
    #   -d '{"model":"BAAI/bge-m3","input":["What is Docker?"],"include":["dense","sparse"]}'

  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    command:
      - "-hf"
      - "unsloth/gemma-4-12b-it-GGUF:UD-Q4_K_XL"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
    ports:
      - "8080:8080"
    volumes:
      - ./model_cache:/root/.cache/huggingface
      - ./models:/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 600s

  app:
    build: .
    env_file: .env
    depends_on:
      qdrant:
        condition: service_started
      infinity:
        condition: service_healthy
    profiles:
      - full

volumes:
  qdrant-data:
